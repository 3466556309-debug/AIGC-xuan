<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIGC-xuan · 两个网页工具</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f4f0e6;
      color: #173f35;
    }
    main { width: min(760px, 100%); }
    h1 { margin: 0 0 8px; font-size: clamp(26px, 5vw, 38px); }
    .lead { margin: 0 0 28px; color: #4b625b; line-height: 1.7; }
    .cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
    a.card {
      display: block;
      padding: 22px;
      border-radius: 18px;
      background: #fffdf8;
      border: 1px solid #ddd5c3;
      box-shadow: 0 8px 24px rgb(23 63 53 / 8%);
      color: inherit;
      text-decoration: none;
    }
    a.card:hover { border-color: #173f35; transform: translateY(-2px); }
    a.card:focus-visible { outline: 3px solid #173f35; outline-offset: 3px; }
    .mark { font-size: 30px; line-height: 1; }
    .name { margin: 12px 0 6px; font-size: 19px; font-weight: 700; }
    .desc { margin: 0; font-size: 14px; line-height: 1.65; color: #4b625b; }
    .foot { margin: 24px 0 0; font-size: 13px; line-height: 1.7; color: #6b7f78; }
    .foot a { color: #173f35; }
    @media (prefers-color-scheme: dark) {
      body { background: #10251f; color: #eef4f1; }
      .lead, .desc, .foot { color: #b9c9c3; }
      a.card { background: #173a31; border-color: #2d5c50; box-shadow: none; }
      a.card:hover { border-color: #cfe3dc; }
      .foot a { color: #eef4f1; }
    }
  </style>
</head>
<body>
  <main>
    <h1>AIGC-xuan</h1>
    <p class="lead">两个互相独立的网页工具，放在同一个 GitHub Pages 站点里。数据都只保存在自己的浏览器中。</p>
    <div class="cards">
      <a class="card" href="./yanyu-cishu/">
        <div class="mark" aria-hidden="true">言</div>
        <div class="name">言语词库</div>
        <p class="desc">公务员、事业单位言语理解成语与实词记忆工具。个人词库、每日计划、间隔复习、离线可用。</p>
      </a>
      <a class="card" href="./gongkao-cuoti/">
        <div class="mark" aria-hidden="true">错</div>
        <div class="name">公考错题本</div>
        <p class="desc">事业单位 D 类错题本：职测 + 综应，录入、错因分析、导图复盘、复习提醒。</p>
      </a>
    </div>
    <p class="foot">
      原网址仍然可用：<a href="https://3466556309-debug.github.io/yanyu-cishu/">言语词库</a> ·
      <a href="https://3466556309-debug.github.io/gongkao-cuoti/">公考错题本</a>
    </p>
  </main>
</body>
</html>
